name: picture_this
description: "Picture This — an AI lifestyle operating system for self-discovery."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # Navigation & state
  go_router: ^14.6.1
  flutter_riverpod: ^2.6.1

  # Visual system — this is a photography-first, editorial-feeling app
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # No local image assets yet — every image in this pass is loaded from a
  # network URL (CachedNetworkImage). Add an `assets:` section here once
  # local assets (app icon source, static illustrations, etc.) exist.
