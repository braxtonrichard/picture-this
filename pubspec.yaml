name: picture_this
description: "Picture This — an AI lifestyle operating system for self-discovery."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend — Postgres + Auth + Storage via Supabase, matching the other
  # project's stack instead of Firebase
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  flutter_dotenv: ^5.2.1

  # Navigation & state
  go_router: ^14.6.1
  flutter_riverpod: ^2.6.1

  # Visual system — this is a photography-first, editorial-feeling app
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Read by flutter_dotenv at startup for SUPABASE_URL/SUPABASE_ANON_KEY.
    # The real .env is gitignored — see .env.example and docs/SETUP.md.
    - .env
